services:
  ai-engine:
    build: ./ai-engine
    ports:
      - "127.0.0.1:8002:8002"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-15}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?Copy .env.example to .env and configure INTERNAL_SERVICE_KEY}
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; assert json.load(urllib.request.urlopen('http://localhost:8002/health'))['status'] == 'healthy'"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://sentinel:sentinel_dev_password@db:5432/sentinel_db}
      AI_ENGINE_URL: ${AI_ENGINE_URL:-http://ai-engine:8002}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?Configure INTERNAL_SERVICE_KEY}
      AI_ENGINE_TIMEOUT_SECONDS: ${AI_ENGINE_TIMEOUT_SECONDS:-40}
      SENTINEL_ENV: ${SENTINEL_ENV:-development}
    depends_on:
      db:
        condition: service_healthy
      ai-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5174:5173"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8001}
    depends_on:
      backend:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel_dev_password}
      POSTGRES_DB: sentinel_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
